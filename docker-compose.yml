services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: e_inter
      POSTGRES_USER: einter
      POSTGRES_PASSWORD: einter
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U einter -d e_inter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --check=false
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - localhost:9092
    ports:
      - "9092:9092"
